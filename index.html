<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>周末有班｜把空闲变成小小底气</title><style>
:root{--ink:#183d36;--green:#17684d;--lime:#e6f495;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:var(--green);color:white;padding:11px 20px;border-radius:9px}button:hover{filter:brightness(.93)}button:focus-visible,a:focus-visible{outline:3px solid #e5b931;outline-offset:3px}header{background:white;border-bottom:1px solid #dfe7e1;padding:18px 5%;display:flex;align-items:center;gap:40px}.logo{font-size:23px;font-weight:850;letter-spacing:-1px}.logo span{background:var(--green);color:var(--lime);border-radius:12px;padding:4px 10px;margin-right:9px}nav{display:flex;gap:8px;flex:1}nav button{background:none;color:#6a7d75}nav button.active{background:#edf4ef;color:var(--green);font-weight:bold}.profile{font-size:14px}main{max-width:1240px;margin:30px auto;padding:0 24px}.hero{display:grid;grid-template-columns:1.5fr 1fr;background:#164f3d;color:white;border-radius:20px;overflow:hidden;min-height:280px}.hero>div{padding:37px 40px}.hero h1{font-size:43px;line-height:1.25;margin:12px 0 18px;letter-spacing:-2px}.hero p{color:#c6dfd2}.hero small{color:#e6f495}.ticket{transform:rotate(4deg);background:var(--lime);color:var(--ink);margin:34px;border-radius:14px;padding:25px!important;box-shadow:10px 10px 0 #ffffff13;position:relative}.ticket strong{font-size:47px;display:block;line-height:1.4}.ticket hr{border:0;border-top:2px dashed #a9bc68;margin:20px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.bar input{flex:1;min-width:200px}.field,input,select,textarea{border:1px solid #dce5de;background:white;padding:12px;border-radius:9px;color:var(--ink)}.layout{display:grid;grid-template-columns:1fr 280px;gap:25px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chips button{background:white;color:#617369;border:1px solid #dce5de}.chips button.active{background:var(--green);color:white}.list{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e0e8e2;border-radius:14px;padding:24px;transition:transform .2s}.card:hover{transform:translateY(-2px);border-color:#9fb8a7}.card h3{font-size:21px;margin:15px 0 5px}.muted{color:#75857c;font-size:14px}.company{display:flex;align-items:center;gap:10px}.icon{display:grid;place-items:center;background:#edf2e9;border-radius:12px;width:44px;height:44px;font-size:24px}.price{font-size:26px;font-weight:800;color:var(--green)}.price small{font-size:14px;font-weight:400}.tags{display:flex;gap:6px;margin:15px 0;flex-wrap:wrap}.tag{font-size:12px;background:#eef6f0;color:#3d7857;padding:3px 8px;border-radius:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.card p{margin:8px 0;font-size:14px}.secondary{background:#eef3ee;color:var(--green)}aside>section{background:#e8efe9;padding:24px;border-radius:14px;margin-bottom:18px}aside h3{margin:0 0 12px}aside button{width:100%;margin-top:15px}.line{border-top:1px solid #d3dfd5;padding-top:15px;margin-top:15px}.notice{font-size:13px;color:#7a897f;margin:25px 0}dialog{border:0;border-radius:18px;padding:32px;max-width:550px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 25px 80px #1236}dialog::backdrop{background:#102b2599}dialog h2{margin-top:0}dialog label{display:block;margin:14px 0}dialog input,dialog select,dialog textarea{width:100%;margin-top:6px}.close{float:right;background:#eef3ee;color:var(--ink);padding:5px 12px}.empty{text-align:center;padding:60px;background:white;border-radius:14px;grid-column:1/-1}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:15px 24px;border-radius:12px;z-index:10}h2{font-size:25px}.wide{grid-column:1/-1}.status{background:#eef5d6;padding:5px 10px;border-radius:6px;font-size:14px}footer{margin-top:40px;padding:24px 0;border-top:1px solid #dce5de;font-size:13p
